<!doctype html>
<html lang="fr" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Anti-Cache Meta Tags pour forcer le chargement de la toute dernière version -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- SEO & PWA Meta Tags -->
    <title>StockFlow Pro — Gestion Commerciale, Stock & Caisse Boutiques</title>
    <meta name="description" content="StockFlow Pro — La plateforme n°1 de gestion de stock, caisse enregistreuse POS et relances WhatsApp en 1-clic pour commerçants et boutiques." />
    <meta name="theme-color" content="#064E3B" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="StockFlow Pro" />
    
    <!-- Google Fonts (Inter Sans-Serif Basique) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <script>
      // Nettoyage immédiat de tous les Service Workers et Caches pour éliminer tout écran blanc
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let r of registrations) { r.unregister(); }
        }).catch(function(){});
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (let name of names) { caches.delete(name); }
        }).catch(function(){});
      }
    </script>
  </head>
  <body class="bg-[#F0FDF4] text-[#064E3B] font-sans antialiased overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx" onerror="setTimeout(function(){ window.location.reload(); }, 1200);"></script>
  </body>
</html>
